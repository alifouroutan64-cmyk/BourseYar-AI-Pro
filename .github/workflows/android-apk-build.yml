name: Android APK build
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: تنظیم جاوا ۱۷
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: نصب گرادل
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: آماده‌سازی Android SDK بدون بسته منسوخ tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: اجرای آزمون‌های واحد
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: ساخت نسخه آزمایشی APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: بارگذاری فایل نصب آزمایشی
        uses: actions/upload-artifact@v4
        with:
          name: BourseYar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: آماده‌سازی کلید امضای انتشار
        if: ${{ secrets.BOURSEYAR_KEYSTORE_BASE64 != '' && secrets.BOURSEYAR_STORE_PASSWORD != '' && secrets.BOURSEYAR_KEY_ALIAS != '' && secrets.BOURSEYAR_KEY_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.BOURSEYAR_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bourseyar-release.jks"
          test -s "$RUNNER_TEMP/bourseyar-release.jks"
      - name: ساخت APK انتشار امضاشده
        if: ${{ secrets.BOURSEYAR_KEYSTORE_BASE64 != '' && secrets.BOURSEYAR_STORE_PASSWORD != '' && secrets.BOURSEYAR_KEY_ALIAS != '' && secrets.BOURSEYAR_KEY_PASSWORD != '' }}
        env:
          BOURSEYAR_STORE_FILE: ${{ runner.temp }}/bourseyar-release.jks
          BOURSEYAR_STORE_PASSWORD: ${{ secrets.BOURSEYAR_STORE_PASSWORD }}
          BOURSEYAR_KEY_ALIAS: ${{ secrets.BOURSEYAR_KEY_ALIAS }}
          BOURSEYAR_KEY_PASSWORD: ${{ secrets.BOURSEYAR_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease --stacktrace
      - name: بارگذاری APK انتشار امضاشده
        if: ${{ secrets.BOURSEYAR_KEYSTORE_BASE64 != '' && secrets.BOURSEYAR_STORE_PASSWORD != '' && secrets.BOURSEYAR_KEY_ALIAS != '' && secrets.BOURSEYAR_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: BourseYar-release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
