name: Android APK build
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: تنظیم جاوا ۱۷
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: نصب گرادل
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: تنظیم Android SDK موجود روی runner
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
      - name: نصب اجزای لازم Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: اجرای آزمون‌های واحد
        run: gradle --no-daemon testDebugUnitTest --stacktrace
      - name: ساخت نسخه آزمایشی APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: بارگذاری فایل نصب
        uses: actions/upload-artifact@v4
        with:
          name: BourseYar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
